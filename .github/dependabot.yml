---
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Two ecosystems:
# - "uv" parses pyproject.toml + uv.lock.
# - "github-actions" keeps the SHA-pinned action references in
#   .github/workflows/ up to date with new tags. Repo rule requires
#   full commit SHA pins, which dependabot will keep current.
#
# Grouping: minor + patch bumps land as one PR per ecosystem per week to
# reduce PR sprawl. Major bumps stay separate so breaking changes get
# their own review.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
...
