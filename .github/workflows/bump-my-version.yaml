name: bump-my-version

# Manually-triggered version bump. Thin caller of the qte77/.github reusable
# workflow: runs bump-my-version via uv (dev dep — see [dependency-groups].dev
# in pyproject.toml) per [tool.bumpversion], syncs uv.lock, collects
# changelog.d/ fragments with scriv, pushes a signed bump-<run>-<base> commit
# via the GitHub API, and opens a PR. Tagging is deferred to tag-release.yaml
# (fires on push-to-main) so the v{new} tag lands on main's squash-merge commit.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Semver part to bump"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

jobs:
  bump:
    uses: qte77/.github/.github/workflows/bump-version.yml@935d32646ef520a1c072bc174485cc1f512aabfa  # main 2026-10-26
    permissions:
      contents: write
      pull-requests: write
    with:
      bump_type: ${{ inputs.bump_type }}
      use_uv: true
      sync_lockfile: true
      collect_scriv: true
      pr_title_template: "chore(release): bump {previous} -> {current}"
