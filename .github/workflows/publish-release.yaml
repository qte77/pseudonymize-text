name: publish-release

# Manually publishes a GitHub Release for an existing tag, with notes extracted
# from the CHANGELOG.md ## [version] block. Decoupled from tag-release.yaml so
# the default flow stays "tag only" — the operator opts into a Release object
# via this dispatch when ready. Thin caller of the qte77/.github reusable
# workflow, which aborts (never overwrites) if the Release already exists.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the latest v* tag)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    uses: qte77/.github/.github/workflows/publish-release.yml@935d32646ef520a1c072bc174485cc1f512aabfa  # main 2026-10-26
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
