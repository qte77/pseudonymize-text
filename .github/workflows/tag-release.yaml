name: tag-release

# Watches main for pyproject.toml version changes (typically the squash-merge
# of a bump-my-version release PR) and creates the annotated v$NEW tag against
# the actual main commit. Thin caller of the qte77/.github reusable workflow;
# its defaults (pyproject.toml, `v` prefix, `^version = "(.*)"`) match this repo.
# Never deletes tags on failure — aborts if the tag already exists.

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read

jobs:
  tag:
    uses: qte77/.github/.github/workflows/tag-release.yml@a32769a925e4d056b5d389ad727f7831973f7161  # main 2026-11-12 (qte77/.github#64)
    permissions:
      contents: write
