[project]
name = "pseudonymize-text"
version = "0.1.0"
description = "Bulk-pseudonymize sensitive entities in text across folder trees with HMAC-keyed deterministic tokens."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "qte77" }]
keywords = ["pseudonymization", "pii", "redaction", "gdpr", "privacy", "hmac"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Text Processing",
]
dependencies = [
  "python-stdnum>=1.20",
  "phonenumberslite>=9.0.31",
  "pydantic>=2.0",
]

[project.optional-dependencies]
# Install with: uv sync --extra ner
# spaCy multilingual NER for entity discovery beyond the term list.
# Off by default; the core install stays dep-light.
ner = ["spacy>=3.7"]

[project.scripts]
pseudonymize = "pseudonymize_text.cli:main"

[project.urls]
Homepage = "https://github.com/qte77/pseudonymize-text"
Issues = "https://github.com/qte77/pseudonymize-text/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.153.6",
  "ruff>=0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pseudonymize_text"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "N", "W", "UP",   # baseline
  "B", "S", "SIM", "RUF", "PT",    # quality
  "ANN", "TC", "PGH", "C90", "D",  # strictness
  "TRY",                            # try/except discipline
]
ignore = [
  "TRY003",  # long error messages outside exception classes — noisy on one-off defensive raises
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D"]  # asserts + fixture tokens are the point of tests; docstrings not required
"scripts/**" = ["D", "ANN"]   # one-off scripts; over-annotating is noise
