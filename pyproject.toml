[project]
name = "pseudonymize-text"
version = "0.3.0"
description = "Bulk-pseudonymize sensitive entities in text across folder trees with HMAC-keyed deterministic tokens."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "qte77" }]
keywords = ["pseudonymization", "pii", "redaction", "gdpr", "privacy", "hmac"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Text Processing",
]
dependencies = [
  "python-stdnum>=1.20",
  "phonenumberslite>=9.0.32",
  "pydantic>=2.0",
]

[project.optional-dependencies]
# Install with: uv sync --extra ner
# spaCy multilingual NER for entity discovery beyond the term list.
# Off by default; the core install stays dep-light.
ner = ["spacy>=3.7"]

[project.scripts]
pseudonymize = "pseudonymize_text.cli:main"

[project.urls]
Homepage = "https://github.com/qte77/pseudonymize-text"
Issues = "https://github.com/qte77/pseudonymize-text/issues"

[dependency-groups]
dev = [
  "scriv[toml]>=1.8",
  "bump-my-version>=0.29",
    "pytest>=9.1.1",
  "pytest-cov>=5.0",
  "hypothesis>=6.155.6",
  "ruff>=0.15.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pseudonymize_text"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "N", "W", "UP",   # baseline
  "B", "S", "SIM", "RUF", "PT",    # quality
  "ANN", "TC", "PGH", "C90", "D",  # strictness
  "TRY",                            # try/except discipline
]
ignore = [
  "TRY003",  # long error messages outside exception classes — noisy on one-off defensive raises
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D"]  # asserts + fixture tokens are the point of tests; docstrings not required
"scripts/**" = ["D", "ANN"]   # one-off scripts; over-annotating is noise

[tool.scriv]
format = "md"
fragment_directory = "changelog.d"
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
md_header_level = "2"
entry_title_template = "[{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"
md_html_anchors = false

[tool.bumpversion]
# [project].version is the single source of truth; bump-my-version bumps + commits and
# syncs src/pseudonymize_text/__init__.py + the README badge. Tag creation is deferred to
# tag-release.yaml so the tag lands on main's squash-merge commit (never on a bump branch).
current_version = "0.3.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
allow_dirty = false
ignore_missing_version = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "v{new_version}"
message = "chore(release): bump {current_version} -> {new_version}"

# pyproject.toml: matches both [project].version and [tool.bumpversion].current_version.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/pseudonymize_text/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

# README version badge keeps the project's teal token (58f4c2), not the canon's -blue.
[[tool.bumpversion.files]]
filename = "README.md"
search = "version-{current_version}-58f4c2"
replace = "version-{new_version}-58f4c2"
