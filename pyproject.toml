[project]
name = "pseudonymize-text"
version = "0.0.1"
description = "Bulk-pseudonymize sensitive entities in text across folder trees with HMAC-keyed deterministic tokens."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "qte77" }]
keywords = ["pseudonymization", "pii", "redaction", "gdpr", "privacy", "hmac"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Text Processing",
]
dependencies = [
  "python-stdnum>=1.20",
  "phonenumberslite>=8.13",
]

[project.optional-dependencies]
# Install with: uv sync --extra ner
# spaCy multilingual NER for entity discovery beyond the term list.
# Off by default; the core install stays dep-light.
ner = ["spacy>=3.7"]

[project.scripts]
pseudonymize = "pseudonymize_text.cli:main"

[project.urls]
Homepage = "https://github.com/qte77/pseudonymize-text"
Issues = "https://github.com/qte77/pseudonymize-text/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pseudonymize_text"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D100", "D101", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
